# tmux configuration - DafnckStudio/AgentikOS
# Minimal Black & White theme

# Couleur du bandeau de status (noir sur blanc)
set -g status-style bg='#000000',fg='#FFFFFF'

# Fenêtre active
setw -g window-status-current-style bg='#FFFFFF',fg='#000000',bold

# Fenêtre inactive
setw -g window-status-style bg='#000000',fg='#888888'

# Bordures des panes
set -g pane-border-style fg='#333333'
set -g pane-active-border-style fg='#FFFFFF',bg=default

# Message bar
set -g message-style bg='#FFFFFF',fg='#000000',bold

# Mode
setw -g mode-style bg='#FFFFFF',fg='#000000'

# Clock
setw -g clock-mode-colour '#FFFFFF'

# Status bar position
set -g status-position bottom

# Rafraîchir la status bar toutes les secondes (temps réel)
set -g status-interval 1

# Status bar format
set -g status-left-length 50
set -g status-right-length 100

# Left side: session name (fond blanc, sans séparateur)
set -g status-left '#[bg=#FFFFFF,fg=#000000,bold] #S #[bg=#000000] '

# Right side: CC, RAM, CPU, Disk (orange + séparateurs discrets)
set -g status-right '#[fg=#FFFFFF,bold]CC: #[fg=#c96442]#(~/.tmux/scripts/claude-usage.sh) #[fg=#333333]│ #[fg=#FFFFFF,bold]RAM: #[fg=#c96442]#(~/.tmux/scripts/ram-usage.sh) #[fg=#333333]│ #[fg=#FFFFFF,bold]CPU: #[fg=#c96442]#(~/.tmux/scripts/cpu-usage.sh) #[fg=#333333]│ #[fg=#FFFFFF,bold]Disk: #[fg=#c96442]#(~/.tmux/scripts/disk-usage.sh) #[fg=#333333]│ #[bg=#FFFFFF,fg=#000000,bold] Agentik_OS '

# Window status format (masqué - on n'affiche pas les noms de fenêtres)
setw -g window-status-format ''
setw -g window-status-current-format ''

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Increase scrollback buffer
set -g history-limit 10000

# Faster command sequences
set -s escape-time 10

# Terminal colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ====== FIXES POUR LONG PROCESSES ======

# NE PAS détacher quand une fenêtre se termine
set -g detach-on-destroy off

# Les fenêtres restent ouvertes après la fin du process
setw -g remain-on-exit on

# Désactiver les timeouts automatiques
set -g display-time 0

# Pas de timeout sur les commandes
set -g repeat-time 0

# Session persiste même si déconnecté
set -g destroy-unattached off

# ====== PLUGINS (TPM) ======

# Chemin des plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Better mouse mode - scroll plus fluide
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# Configuration du scroll
set -g @scroll-speed-num-lines-per-scroll 5
set -g @scroll-down-exit-copy-mode "on"
set -g @scroll-without-changing-pane "on"
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"

# Initialiser TPM
run '~/.tmux/plugins/tpm/tpm'

# ====== OVERRIDE APRÈS PLUGIN : Inverser le scroll ======
# Ces bindings s'appliquent APRÈS le plugin pour inverser le sens

bind -T copy-mode WheelUpPane send-keys -X scroll-down \; send-keys -X scroll-down \; send-keys -X scroll-down \; send-keys -X scroll-down \; send-keys -X scroll-down
bind -T copy-mode WheelDownPane send-keys -X scroll-up \; send-keys -X scroll-up \; send-keys -X scroll-up \; send-keys -X scroll-up \; send-keys -X scroll-up
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-down \; send-keys -X scroll-down \; send-keys -X scroll-down \; send-keys -X scroll-down \; send-keys -X scroll-down
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-up \; send-keys -X scroll-up \; send-keys -X scroll-up \; send-keys -X scroll-up \; send-keys -X scroll-up
