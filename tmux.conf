# ══════════════════════════════════════════════════════════════
# TMUX CONFIG - VPS Agentik
# ══════════════════════════════════════════════════════════════

# ====== SESSION KILL FORENSICS ======
# Log every session close and pane death to trace mystery kills
set-hook -g session-closed "run-shell 'echo \"[$(date -Iseconds)] SESSION CLOSED\" >> /home/hacker/.aisb/logs/session-kills.log'"
set-hook -g pane-died "run-shell 'echo \"[$(date -Iseconds)] PANE DIED session=#{session_name} pane=#{pane_id}\" >> /home/hacker/.aisb/logs/session-kills.log'"

# ====== TERMINAL ======
set -g default-terminal "tmux-256color"
# Use set-option (not -sa append) to avoid duplicates on config reload
# True color support (cursor style removed — causes garbage with Termius)
# The Ss/Se sequences (\E[Xq) were sent to ALL terminals via wildcard *:
# terminals that don't understand them print "q" or "2q" as literal text.
# Ms= disables mouse sequence forwarding to apps (tmux handles mouse itself)
set -s terminal-overrides "linux*:AX@,xterm-256color:Tc:Ms=,xterm:Tc:Ms="
# Clipboard + terminal features.
# REMOVED: 'focus' — Termius sends \e[I / \e[O focus events that leak as ^[[I^[[O
#          garbage into panes, even with focus-events off (tmux still forwards them).
# REMOVED: 'cstyle' — cursor style changes produce escape sequences that terminals
#          may misparse, especially over SSH → random "q" or digits on screen.
# REMOVED: 'paste' — PTY buffer deadlock on large pastes in Claude Code.
set -s terminal-features "xterm*:clipboard:ccolour:title,screen*:title,rxvt*:ignorefkeys"

# UTF-8
set -q -g status-utf8 on
setw -q -g utf8 on

# ====== BASIC ======
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
# escape-time set below in Focus events section (10ms)

# ====== LARGE PASTE FIX (Termius) ======
# Number of paste/copy buffers tmux keeps
set -s buffer-limit 100
# assume-paste-time: when characters arrive within this ms, treat as paste.
# tmux 3.5a buffers "paste" input and writes it all at once → PTY deadlock.
# Set to 0 to disable this grouping. Each character is written individually,
# which is slower but CANNOT deadlock the PTY buffer.
set -g assume-paste-time 0
# Enable clipboard integration (OSC 52 - works with Termius)
set -s set-clipboard on
# DISABLE passthrough: reduces escape sequence processing overhead during paste.
set -g allow-passthrough off
# Increase the tmux input queue (tmux 3.5+). Default is ~1024 bytes.
# Larger queue = tmux can buffer more paste data before processing.
# This prevents "input queue ran out of room" scenarios.
set -s message-limit 500

# ====== ALTERNATE SCREEN ======
# Re-enabled alternate screen (default: on) to fix paste freezes.
# With alternate-screen off, ALL TUI output (Claude Code redraws) floods
# the scrollback buffer during paste, overwhelming tmux and freezing the pane.
# Scrollback through Claude Code output: use Ctrl+b [ or Option+s to enter
# copy-mode, or Ctrl+b u/d for page up/down.
setw -g alternate-screen on

# Focus events — OFF to prevent \e[I / \e[O leaking as garbage characters
set -g focus-events off

# Extended keys — let tmux handle modern key sequences properly
# Without this, some escape sequences pass through raw → garbage
set -g extended-keys on

# Reduce escape-time further: faster escape sequence detection = less ambiguity
# With 50ms, tmux sometimes misidentifies partial sequences as literal chars
set -s escape-time 10

# ====== MOUSE + SCROLL (Termius compatible) ======
set -g mouse on

# ====== SCROLL INTELLIGENT ======
# When pane is in alternate screen (Claude Code TUI): enter copy-mode on scroll up.
# This prevents mouse escape sequences from being forwarded to Claude Code
# which would print them as garbage characters (random letters on screen).
# When NOT in alternate screen (normal shell): same behavior, safe scroll.
bind -n WheelUpPane if-shell -F "#{alternate_on}" "copy-mode -e ; send-keys -M" "copy-mode -e ; send-keys -M"
bind -n WheelDownPane if-shell -F "#{pane_in_mode}" "send-keys -M" ""

# Prevent mouse click events from reaching alternate screen apps (Claude Code)
# Without this, every click sends \e[<0;x;yM which Claude prints as garbage
bind -n MouseDown1Pane if-shell -F "#{alternate_on}" "" "select-pane -t="
bind -n MouseDown3Pane if-shell -F "#{alternate_on}" "" ""

# Copy-mode scroll (mouse wheel) - 5 lines per tick
bind -T copy-mode WheelUpPane send-keys -X -N 5 scroll-up
bind -T copy-mode WheelDownPane send-keys -X -N 5 scroll-down
bind -T copy-mode-vi WheelUpPane send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down

# Click anywhere to exit copy-mode (natural UX)
bind -T copy-mode MouseDown1Pane send-keys -X cancel
bind -T copy-mode-vi MouseDown1Pane send-keys -X cancel

# Exit copy-mode
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode q send-keys -X cancel

# ====== TERMIUS SCROLL WORKAROUND ======
# Termius may send arrow keys instead of mouse wheel events.
# These bindings make Up/Down arrows enter copy-mode and scroll
# when in alternate screen (Claude Code). Normal shells are unaffected.
#
# Option+Up/Down → scroll (works even when Claude blocks)
bind -n M-Up copy-mode \; send-keys -X scroll-up
bind -n M-Down send-keys -X scroll-down
# Shift+Up/Down → half page scroll
bind -n S-Up copy-mode \; send-keys -X halfpage-up
bind -n S-Down send-keys -X halfpage-down

# ====== ONE-KEY SCROLL MODE (Termius-friendly) ======
# Ctrl+b s → Enter scroll mode (single key, easy to remember)
# Then use: Up/Down arrows, Page Up/Down, or mouse wheel if supported
# Press q or Escape to exit scroll mode
bind s copy-mode -e

# ====== STYLES (adaptatif au thème terminal) ======
set -g status-style bg=default,fg=default
setw -g window-status-current-style bg=default,fg=default,bold
setw -g window-status-style bg=default,fg=default,dim
set -g pane-border-style fg=default,dim
set -g pane-active-border-style fg=colour137
# Show agent/pane labels on borders (clickable!)
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=colour137 bold],#[fg=default dim]}#P: #{pane_title} #{?pane_active,#[fg=colour137]●,○} "
set -g message-style bg=default,fg=default,bold
setw -g mode-style reverse

# ====== STATUS BAR ======
set -g status-position bottom
set -g status on
# Reduced from 5s to 30s to prevent status bar script execution from
# blocking tmux during large paste operations (9 scripts, ~1100ms total).
# 30s is plenty for status info that doesn't change rapidly.
set -g status-interval 30
set -g status-left-length 150
set -g status-right-length 80

# LEFT: Pomodoro • Session • TS • Push • Branch (cached - no subprocess spawning)
set -g status-left '  #[fg=colour137,bold]#S #[fg=default,nobold]• TS #[fg=colour137]#(~/.tmux/scripts/read-cache.sh sessions-count) #[fg=default]• #[fg=colour137]#(~/.tmux/scripts/read-cache.sh last-push) #[fg=default]• #[fg=colour137]#(~/.tmux/scripts/read-cache.sh git-branch) '

# RIGHT: CC • Disk • CPU • RAM • Tunnel (cached - no subprocess spawning)
set -g status-right '#[fg=default]D #[fg=colour137]#(~/.tmux/scripts/read-cache.sh disk-usage) #[fg=default]• C #[fg=colour137]#(~/.tmux/scripts/read-cache.sh cpu-usage) #[fg=default]• R #[fg=colour137]#(~/.tmux/scripts/read-cache.sh ram-usage) #[fg=default]• T #[fg=colour137]#(~/.tmux/scripts/read-cache.sh tunnel-status)  '

# Hide window list (clean look)
setw -g window-status-format ''
setw -g window-status-current-format ''

# ====== PASTE DEADLOCK PREVENTION (pipe-pane -I) ======
# The root cause of paste freezes:
#   Termius sends large paste → tmux writes to PTY (4KB buffer) →
#   Claude Code can't drain fast enough → tmux write() blocks →
#   entire tmux event loop freezes → DEADLOCK
#
# The fix: pipe-pane -I inserts a 64KB pipe buffer between tmux and PTY.
#   tmux writes to pipe (64KB, never fills) → throttle script writes to PTY →
#   even if PTY blocks, tmux stays responsive.
#
# Auto-enabled on every new pane. Toggle with Ctrl+b I.
# Normal typing: <1μs overhead. Paste: throttled delivery. Large paste: saved to file.

# AUTO-ENABLE: pipe-pane on every new pane
set-hook -g after-new-window "pipe-pane -I 'python3 ~/.tmux/scripts/input-throttle.py'"
set-hook -g after-new-session "pipe-pane -I 'python3 ~/.tmux/scripts/input-throttle.py'"
set-hook -g after-split-window "pipe-pane -I 'python3 ~/.tmux/scripts/input-throttle.py'"

# AUTO-LAYOUT: Apply main-horizontal on EVERY split (Agent Teams friendly)
# Pane 1 = lead (60%), teammates stack side-by-side below
# Triggers IMMEDIATELY when first teammate spawns, not after all
# ALWAYS returns focus to pane 1 (lead) — critical for mobile
set-hook -g after-split-window "select-layout main-horizontal ; resize-pane -t 1 -y 60% ; select-pane -t 1"

# Ctrl+b I → Toggle input throttle on/off (in case it causes issues)
bind I if-shell "tmux display-message -p '#{pipe_pane}' | grep -q python" \
    "pipe-pane ; display-message 'Input throttle: OFF'" \
    "pipe-pane -I 'python3 ~/.tmux/scripts/input-throttle.py' ; display-message 'Input throttle: ON'"

# Ctrl+b v → Throttled paste from tmux buffer (manual fallback)
bind v run-shell "~/.tmux/scripts/safe-paste.sh"

# Ctrl+b ] → Safe chunked paste (override default)
bind ] run-shell "~/.tmux/scripts/safe-paste.sh"

# Ctrl+b P → SAFE PASTE POPUP (alternative for very large text)
# Opens a popup where you can freely paste. Press Ctrl+D to send.
bind P display-popup -E -w 80% -h 50% -T " Safe Paste " "~/.tmux/scripts/paste-popup.sh"

# ====== STATUS CACHE DAEMON ======
# Start cache daemon if not running (populates /tmp/tmux-status-cache/ every 30s)
# Status bar reads from cache files = instant, no subprocess spawning = no paste interference
if-shell "! pgrep -f cached-status.sh" "run-shell -b 'nohup bash ~/.tmux/scripts/cached-status.sh >/dev/null 2>&1 &'"

# ====== KEYBINDINGS ======
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
# Alt+g → Force full redraw (clears display corruption)
bind -n M-g refresh-client -S
# Ctrl+b R → Nuclear redraw: clear + refresh (when Alt+g isn't enough)
bind R run-shell "tmux clear-history ; printf '\\033c'" \; refresh-client -S \; display-message "Display cleared"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n M-c copy-mode

# Force copy-mode même en alternate screen (pour lire les réponses Claude)
bind -n M-s copy-mode -e

# ====== MOBILE SCROLL (phone-friendly) ======
# Ctrl+b then [ = enter scroll mode (standard)
# Ctrl+b then u = scroll UP (page up) - easy on mobile
# Ctrl+b then d = scroll DOWN (page down) - easy on mobile
# Ctrl+b then g = go to TOP of history
# Ctrl+b then G = go to BOTTOM of history
bind u copy-mode \; send-keys -X halfpage-up
bind d send-keys -X halfpage-down
bind g copy-mode \; send-keys -X history-top
bind G send-keys -X history-bottom

# Double-tap Ctrl+b Ctrl+b to enter scroll mode (mobile friendly)
bind C-b copy-mode -e

# ====== SESSION NAVIGATOR ======
# Ctrl+b z → Ouvre le navigateur de sessions (popup fzf)
# Option+z (M-z) → Raccourci direct
# Enter → Switch à la session
# x → Kill la session SANS confirmation, reste dans le navigateur
bind z display-popup -E -w 100% -h 100% -T " Sessions " "~/.tmux/scripts/session-manager-v2.sh"
# Option+z (M-z) → Session navigator (safe: focus-events is off)
bind -n M-z display-popup -E -w 100% -h 100% -T " Sessions " "~/.tmux/scripts/session-manager-v2.sh"
bind -n C-l display-popup -E -w 100% -h 100% -T " Sessions " "~/.tmux/scripts/session-manager-v2.sh"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# AGENT SWITCHER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Ctrl+b t → Agent picker popup (works in ANY session with subagents)
bind-key t display-popup -E -w 80% -h 60% -T " 🤖 Switch Agent " "~/.tmux/scripts/agent-picker.sh"

# Alt+1/2/3/4 → Quick switch to pane by number (no prefix needed!)
# Convention: Pane 1 = LEAD (main chat, always bottom), 2+ = teammates (top)
bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5
bind -n M-6 select-pane -t 6
bind -n M-7 select-pane -t 7
bind -n M-8 select-pane -t 8

# Ctrl+b 1/2/3/4 → Switch to pane by number (primary method)
bind 1 select-pane -t 1
bind 2 select-pane -t 2
bind 3 select-pane -t 3
bind 4 select-pane -t 4

# Ctrl+b h → HOME: Always jump to pane 1 (main chat) — the panic button
bind h select-pane -t 1

# Ctrl+b Tab → Cycle to next pane (quick toggle between agents)
# Ctrl+b Shift+Tab → Cycle to previous pane
bind Tab select-pane -t :.+
bind BTab select-pane -t :.-

