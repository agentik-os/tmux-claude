# ══════════════════════════════════════════════════════════════
# TMUX CONFIG - VPS Agentik
# ══════════════════════════════════════════════════════════════

# ====== TERMINAL ======
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:Tc"
set -sa terminal-overrides ",xterm:Tc"
# Cursor style overrides
set -sa terminal-overrides ",*:Ss=\\E[%p1%d q:Se=\\E[2 q"
# Enable clipboard and paste features for the terminal
set -sa terminal-features ",xterm-256color:clipboard:paste"
set -sa terminal-features ",xterm*:clipboard:paste"

# UTF-8
set -q -g status-utf8 on
setw -q -g utf8 on

# ====== BASIC ======
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -s escape-time 10

# ====== LARGE PASTE FIX ======
# Number of paste/copy buffers tmux keeps
set -s buffer-limit 100
# CRITICAL: Characters arriving within this interval (ms) are treated as a
# paste, not individual keystrokes. Over SSH, inter-character gaps can reach
# 10-50ms easily. 100ms ensures even large pastes over slow links are
# recognized as a single paste event instead of processed char-by-char.
set -g assume-paste-time 100
# Enable clipboard integration with the outer terminal
set -s set-clipboard on
# Allow passthrough for specific escape sequences (needed for some terminals)
set -g allow-passthrough on

# ====== ALTERNATE SCREEN ======
# Re-enabled alternate screen (default: on) to fix paste freezes.
# With alternate-screen off, ALL TUI output (Claude Code redraws) floods
# the scrollback buffer during paste, overwhelming tmux and freezing the pane.
# Scrollback through Claude Code output: use Ctrl+b [ or Option+s to enter
# copy-mode, or Ctrl+b u/d for page up/down.
setw -g alternate-screen on

# Focus events
set -g focus-events on
set-hook -g client-focus-in "refresh-client -S"

# ====== MOUSE + SCROLL ======
set -g mouse on

# ====== SCROLL INTELLIGENT ======
# ALWAYS enter copy-mode on scroll up (works on mobile + Claude Code sessions)
bind -n WheelUpPane copy-mode -e \; send-keys -M
bind -n WheelDownPane send-keys -M

# Copy-mode scroll (molette)
bind -T copy-mode WheelUpPane send-keys -X -N 5 scroll-up
bind -T copy-mode WheelDownPane send-keys -X -N 5 scroll-down
bind -T copy-mode-vi WheelUpPane send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down

# Exit copy-mode
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode q send-keys -X cancel

# FORCE SCROLL - Option+Up/Down pour scroller MÊME quand Claude bloque
bind -n M-Up copy-mode \; send-keys -X scroll-up
bind -n M-Down send-keys -X scroll-down
# Option+PageUp/PageDown pour page entière
bind -n S-Up copy-mode \; send-keys -X halfpage-up
bind -n S-Down send-keys -X halfpage-down

# ====== STYLES (adaptatif au thème terminal) ======
set -g status-style bg=default,fg=default
setw -g window-status-current-style bg=default,fg=default,bold
setw -g window-status-style bg=default,fg=default,dim
set -g pane-border-style fg=default,dim
set -g pane-active-border-style fg=colour3
# Show agent/pane labels on borders (clickable!)
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=colour3 bold],#[fg=default dim]}#P: #{pane_title} #{?pane_active,#[fg=colour3]●,○} "
set -g message-style bg=default,fg=default,bold
setw -g mode-style reverse

# ====== STATUS BAR ======
set -g status-position bottom
set -g status on
# Reduced from 5s to 15s to prevent status bar script execution from
# blocking tmux during large paste operations (9 scripts, ~1100ms total)
set -g status-interval 15
set -g status-left-length 150
set -g status-right-length 80

# LEFT: Pomodoro • Session • TS • Push • Branch (avec padding)
set -g status-left '  #[fg=colour3]#(~/.tmux/scripts/pomodoro.sh) #[fg=default]• #[fg=colour3,bold]#S #[fg=default,nobold]• TS #[fg=colour3]#(~/.tmux/scripts/sessions-count.sh) #[fg=default]• #[fg=colour3]#(~/.tmux/scripts/last-push.sh) #[fg=default]• #[fg=colour3]#(~/.tmux/scripts/git-branch.sh) '

# RIGHT: CC • Disk • CPU • RAM • Tunnel (avec padding)
set -g status-right '#[fg=default]CC #[fg=colour3]#(~/.tmux/scripts/claude-account.sh) #[fg=default]• Disk #[fg=colour3]#(~/.tmux/scripts/disk-usage.sh) #[fg=default]• CPU #[fg=colour3]#(~/.tmux/scripts/cpu-usage.sh) #[fg=default]• RAM #[fg=colour3]#(~/.tmux/scripts/ram-usage.sh) #[fg=default]• Tunnel #[fg=colour3]#(~/.tmux/scripts/tunnel-status.sh)  '

# Hide window list (clean look)
setw -g window-status-format ''
setw -g window-status-current-format ''

# ====== KEYBINDINGS ======
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
bind -n M-g refresh-client -S
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n M-c copy-mode

# Force copy-mode même en alternate screen (pour lire les réponses Claude)
bind -n M-s copy-mode -e

# ====== MOBILE SCROLL (phone-friendly) ======
# Ctrl+b then [ = enter scroll mode (standard)
# Ctrl+b then u = scroll UP (page up) - easy on mobile
# Ctrl+b then d = scroll DOWN (page down) - easy on mobile
# Ctrl+b then g = go to TOP of history
# Ctrl+b then G = go to BOTTOM of history
bind u copy-mode \; send-keys -X halfpage-up
bind d send-keys -X halfpage-down
bind g copy-mode \; send-keys -X history-top
bind G send-keys -X history-bottom

# Double-tap Ctrl+b Ctrl+b to enter scroll mode (mobile friendly)
bind C-b copy-mode -e

# ====== SESSION NAVIGATOR ======
# Ctrl+b z → Ouvre le navigateur de sessions (popup fzf)
# Option+z (M-z) → Raccourci direct
# Enter → Switch à la session
# x → Kill la session SANS confirmation, reste dans le navigateur
bind z display-popup -E -w 100% -h 100% -T " Sessions " "~/.tmux/scripts/session-manager-v2.sh"
bind -n M-z display-popup -E -w 100% -h 100% -T " Sessions " "~/.tmux/scripts/session-manager-v2.sh"
bind -n C-l display-popup -E -w 100% -h 100% -T " Sessions " "~/.tmux/scripts/session-manager-v2.sh"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# AGENT SWITCHER
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Ctrl+b t → Agent picker popup (works in ANY session with subagents)
bind-key t display-popup -E -w 80% -h 60% -T " 🤖 Switch Agent " "~/.tmux/scripts/agent-picker.sh"

# Alt+1/2/3/4 → Quick switch to pane by number (no prefix needed!)
bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5
bind -n M-6 select-pane -t 6
bind -n M-7 select-pane -t 7
bind -n M-8 select-pane -t 8

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ALT REALITY SHORTCUTS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Ctrl+b a → AltReality content creation menu
bind-key a display-menu -T "#[fg=colour3,bold] Alt Reality " \
    "Write Article"       w "run-shell '~/.tmux/scripts/altreality-menu.sh article'" \
    "Generate Podcast"    p "run-shell '~/.tmux/scripts/altreality-menu.sh podcast'" \
    "Create Video"        v "run-shell '~/.tmux/scripts/altreality-menu.sh video'" \
    "" \
    "AI Research + PDF"   r "run-shell '~/.tmux/scripts/altreality-menu.sh research'" \
    "Social Carousel"     s "run-shell '~/.tmux/scripts/altreality-menu.sh social'" \
    "Ideation"            i "run-shell '~/.tmux/scripts/altreality-menu.sh ideation'" \
    "" \
    "Cinema Pipeline"     c "run-shell '~/.tmux/scripts/altreality-menu.sh cinema'" \
    "Branding Kit"        b "run-shell '~/.tmux/scripts/altreality-menu.sh branding'" \
    "" \
    "Open AltReality"     o "run-shell '~/.tmux/scripts/altreality-menu.sh open'"

