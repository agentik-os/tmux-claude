# ══════════════════════════════════════════════════════════════
# tmux-claude configuration
# https://github.com/agentik-os/tmux-claude
# ══════════════════════════════════════════════════════════════

# ====== TERMINAL ======
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:Tc"
set -sa terminal-overrides ",xterm:Tc"

# UTF-8
set -q -g status-utf8 on
setw -q -g utf8 on

# ====== BASIC ======
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 50

# Focus events (helps Claude Code detect window focus)
set -g focus-events on
set-hook -g client-focus-in "refresh-client -S"

# ====== MOUSE + SCROLL ======
set -g mouse on

# Pass scroll to app in alternate screen (Claude Code, vim, etc.)
bind -n WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "copy-mode -e; send-keys -M"
bind -n WheelDownPane if-shell -F "#{alternate_on}" "send-keys -M" "send-keys -M"

# Copy-mode scroll
bind -T copy-mode WheelUpPane send-keys -X -N 3 scroll-up
bind -T copy-mode WheelDownPane send-keys -X -N 3 scroll-down
bind -T copy-mode-vi WheelUpPane send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# Exit copy-mode
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode q send-keys -X cancel

# ====== STYLES (adapts to terminal theme) ======
set -g status-style bg=default,fg=default
setw -g window-status-current-style bg=default,fg=default,bold
setw -g window-status-style bg=default,fg=default,dim
set -g pane-border-style fg=default,dim
set -g pane-active-border-style fg=default
set -g message-style bg=default,fg=default,bold
setw -g mode-style reverse

# ====== STATUS BAR ======
set -g status-position bottom
set -g status on
set -g status-interval 5
set -g status-left-length 150
set -g status-right-length 80

# LEFT: Pomodoro | Session | Sessions count | Background tasks | Last push | Git branch
set -g status-left '  #[fg=colour3]#(~/.tmux/scripts/pomodoro.sh) #[fg=default]| #[fg=colour3,bold]#S #[fg=default,nobold]| TS #[fg=colour3]#(~/.tmux/scripts/sessions-count.sh) #[fg=default]| BG #[fg=colour3]#(~/.tmux/scripts/bg-tasks.sh) #[fg=default]| #[fg=colour3]#(~/.tmux/scripts/last-push.sh) #[fg=default]| #[fg=colour3]#(~/.tmux/scripts/git-branch.sh) '

# RIGHT: Claude account | RAM | CPU | Disk | Tunnel status
set -g status-right '#[fg=default]CC #[fg=colour3]#(~/.tmux/scripts/claude-account.sh) #[fg=default]| RAM #[fg=colour3]#(~/.tmux/scripts/ram-usage.sh) #[fg=default]| CPU #[fg=colour3]#(~/.tmux/scripts/cpu-usage.sh) #[fg=default]| Disk #[fg=colour3]#(~/.tmux/scripts/disk-usage.sh) #[fg=default]| Tunnel #[fg=colour3]#(~/.tmux/scripts/tunnel-status.sh)  '

# Hide window list (clean status bar)
setw -g window-status-format ''
setw -g window-status-current-format ''

# ====== KEYBINDINGS ======
# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Manual refresh
bind -n M-g refresh-client -S

# Split panes (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Copy mode
bind -n M-c copy-mode

# ====== SESSION NAVIGATOR ======
# Ctrl+b z -> Open session navigator
# Option+z (M-z) -> Quick session navigator
bind z choose-tree -s -O name
bind -n M-z choose-tree -s -O name
