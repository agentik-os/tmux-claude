# ══════════════════════════════════════════════════════════════
# tmux-claude configuration v3.0
# https://github.com/agentik-os/tmux-claude
#
# Theme-neutral: adapts to any terminal theme (Termius, iTerm2,
# Alacritty, etc.) - no hardcoded colors except colour3 (yellow
# accent) which maps to your terminal's ANSI yellow.
# ══════════════════════════════════════════════════════════════

# ====== TERMINAL ======
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:Tc"
set -sa terminal-overrides ",xterm:Tc"
# Cursor style passthrough
set -sa terminal-overrides ",*:Ss=\\E[%p1%d q:Se=\\E[2 q"
# Clipboard and paste support
set -sa terminal-features ",xterm-256color:clipboard:paste"
set -sa terminal-features ",xterm*:clipboard:paste"

# UTF-8
set -q -g status-utf8 on
setw -q -g utf8 on

# ====== BASIC ======
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -s escape-time 10

# ====== LARGE PASTE FIX ======
# Paste buffers
set -s buffer-limit 100
# Characters arriving within this interval (ms) are treated as a paste.
# Over SSH, inter-character gaps can reach 10-50ms. 100ms ensures large
# pastes over slow links are recognized as a single paste event.
set -g assume-paste-time 100
# Clipboard integration
set -s set-clipboard on
# Allow passthrough for escape sequences
set -g allow-passthrough on

# ====== ALTERNATE SCREEN ======
# Keep alternate screen ON to prevent paste freezes with TUI apps.
# Without this, Claude Code redraws flood the scrollback buffer
# during paste, overwhelming tmux.
setw -g alternate-screen on

# Focus events (helps Claude Code detect window focus)
set -g focus-events on
set-hook -g client-focus-in "refresh-client -S"

# ====== MOUSE + SCROLL ======
set -g mouse on

# ====== SCROLL (works with mobile SSH clients + Claude Code) ======
# Always enter copy-mode on scroll up
bind -n WheelUpPane copy-mode -e \; send-keys -M
bind -n WheelDownPane send-keys -M

# Copy-mode scroll speed (5 lines per wheel tick)
bind -T copy-mode WheelUpPane send-keys -X -N 5 scroll-up
bind -T copy-mode WheelDownPane send-keys -X -N 5 scroll-down
bind -T copy-mode-vi WheelUpPane send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down

# Exit copy-mode
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode q send-keys -X cancel

# Option+Up/Down to scroll even when Claude Code blocks input
bind -n M-Up copy-mode \; send-keys -X scroll-up
bind -n M-Down send-keys -X scroll-down
# Shift+Up/Down for half-page scroll
bind -n S-Up copy-mode \; send-keys -X halfpage-up
bind -n S-Down send-keys -X halfpage-down

# ====== STYLES (adapts to terminal theme - no hardcoded colors) ======
set -g status-style bg=default,fg=default
setw -g window-status-current-style bg=default,fg=default,bold
setw -g window-status-style bg=default,fg=default,dim
set -g pane-border-style fg=default,dim
set -g pane-active-border-style fg=default
set -g message-style bg=default,fg=default,bold
setw -g mode-style reverse

# ====== STATUS BAR ======
set -g status-position bottom
set -g status on
# 15s interval prevents status bar scripts from blocking during paste
set -g status-interval 15
set -g status-left-length 150
set -g status-right-length 80

# LEFT: Pomodoro • Session • Sessions count • Last push • Git branch
set -g status-left '  #[fg=colour3]#(~/.tmux/scripts/pomodoro.sh) #[fg=default]• #[fg=colour3,bold]#S #[fg=default,nobold]• TS #[fg=colour3]#(~/.tmux/scripts/sessions-count.sh) #[fg=default]• #[fg=colour3]#(~/.tmux/scripts/last-push.sh) #[fg=default]• #[fg=colour3]#(~/.tmux/scripts/git-branch.sh) '

# RIGHT: Claude account • Disk • CPU • RAM • Tunnel
set -g status-right '#[fg=default]CC #[fg=colour3]#(~/.tmux/scripts/claude-account.sh) #[fg=default]• Disk #[fg=colour3]#(~/.tmux/scripts/disk-usage.sh) #[fg=default]• CPU #[fg=colour3]#(~/.tmux/scripts/cpu-usage.sh) #[fg=default]• RAM #[fg=colour3]#(~/.tmux/scripts/ram-usage.sh) #[fg=default]• Tunnel #[fg=colour3]#(~/.tmux/scripts/tunnel-status.sh)  '

# Hide window list (clean look)
setw -g window-status-format ''
setw -g window-status-current-format ''

# ====== KEYBINDINGS ======
# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
# Manual refresh
bind -n M-g refresh-client -S
# Split panes (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Copy mode shortcuts
bind -n M-c copy-mode
bind -n M-s copy-mode -e

# ====== MOBILE-FRIENDLY SCROLL ======
# Ctrl+b u = half-page up (easy on phone keyboards)
# Ctrl+b d = half-page down
# Ctrl+b g = top of history
# Ctrl+b G = bottom of history
bind u copy-mode \; send-keys -X halfpage-up
bind d send-keys -X halfpage-down
bind g copy-mode \; send-keys -X history-top
bind G send-keys -X history-bottom
# Double-tap Ctrl+b to enter copy-mode
bind C-b copy-mode -e

# ====== SESSION NAVIGATOR (fzf popup) ======
# Fullscreen popup with Claude status, git branch, session preview
# Ctrl+b z  = open session manager
# Option+z  = open session manager (no prefix)
# Ctrl+l    = open session manager (no prefix, Termius-friendly)
#
# Inside the popup:
#   Enter = switch to session
#   x     = kill session instantly (no confirmation)
#   Esc   = close
#   Tab   = multi-select (in close submenu)
bind z display-popup -E -w 100% -h 100% -T " Sessions " "~/.tmux/scripts/session-manager.sh"
bind -n M-z display-popup -E -w 100% -h 100% -T " Sessions " "~/.tmux/scripts/session-manager.sh"
bind -n C-l display-popup -E -w 100% -h 100% -T " Sessions " "~/.tmux/scripts/session-manager.sh"
